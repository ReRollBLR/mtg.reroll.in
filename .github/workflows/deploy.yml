name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild to bake in the latest event feed (new date / ticket link).
    # GitHub Actions cron is UTC: Sun 00:00 IST (UTC+5:30) = Sat 18:30 UTC.
    - cron: "30 18 * * 6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: "npm"
      # Use `npm install` rather than `npm ci`: the lockfile is generated on
      # macOS/npm-11 and can omit Linux-only optional deps (npm/cli#4828), which
      # makes strict `npm ci` fail. `npm install` resolves platform deps on the runner.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Fail fast if the Pages backend stalls on `deployment_queued` instead of
    # blocking the concurrency group for the full default timeout.
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
